    function App() {
      const [gameState, setGameState] = useState('locked'); // locked, welcome, playing, result, review_complete
      const [passwordInput, setPasswordInput] = useState('');
      const [pwdError, setPwdError] = useState(false);
      
      const [activeSequence, setActiveSequence] = useState([]); 
      const [drillIdx, setDrillIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [timeLeft, setTimeLeft] = useState(200); 
      const [lap, setLap] = useState(1); 
      const [stats, setStats] = useState({ correct: 0, total: 0 });

      // Review Mode
      const [wrongDrills, setWrongDrills] = useState([]);
      const [isReviewMode, setIsReviewMode] = useState(false);

      const [selectedParts, setSelectedParts] = useState([]);
      const [shuffledOptions, setShuffledOptions] = useState([]);
      const [typedInput, setTypedInput] = useState('');
      const [feedback, setFeedback] = useState(null); 
      const [wrongTimeoutId, setWrongTimeoutId] = useState(null);
      
      const [personalBest, setPersonalBest] = useState({ score: 0, tier: '아이언 (Iron)' });
      const [prevTier, setPrevTier] = useState('아이언 (Iron)');
      const [showTierUpAnimation, setShowTierUpAnimation] = useState(false);

      const inputRef = useRef(null);
      const currentDrill = activeSequence[drillIdx];

      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        if (passwordInput === '0826') {
          setGameState('welcome');
          setPwdError(false);
        } else {
          setPwdError(true);
          setPasswordInput('');
        }
      };

      const getTierMetadata = (currentScore) => {
        const tier = TIERS_CONFIG.find(t => currentScore >= t.min);
        return tier || TIERS_CONFIG[TIERS_CONFIG.length - 1];
      };

      const generateLapSequence = (currentLap) => {
        let sequence = [];
        if (currentLap === 1) {
          for (let lvl = 1; lvl <= 10; lvl++) {
            const levelDrills = ALL_DRILLS_POOL.filter(d => d.level === lvl);
            const shuffled = levelDrills.sort(() => Math.random() - 0.5);
            sequence.push(...shuffled.slice(0, 3)); 
          }
        } else {
          for (let lvl = 6; lvl <= 10; lvl++) {
            const levelDrills = ALL_DRILLS_POOL.filter(d => d.level === lvl);
            const shuffled = levelDrills.sort(() => Math.random() - 0.5);
            sequence.push(...shuffled.slice(0, 6)); 
          }
        }
        return sequence;
      };

      useEffect(() => {
        const savedBest = localStorage.getItem('passive_arcade_best_score');
        if (savedBest) {
          setPersonalBest(JSON.parse(savedBest));
        }
      }, []);

      useEffect(() => {
        if (gameState === 'playing' && !isReviewMode && timeLeft > 0) {
          const timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setGameState('result');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }
      }, [gameState, timeLeft, isReviewMode]);

      useEffect(() => {
        if (gameState === 'playing' && !isReviewMode) {
          const currentTier = getTierMetadata(score).name;
          if (currentTier !== prevTier) {
            const currentIndex = TIERS_CONFIG.findIndex(t => t.name === currentTier);
            const prevIndex = TIERS_CONFIG.findIndex(t => t.name === prevTier);
            if (currentIndex < prevIndex) {
              setShowTierUpAnimation(true);
              setTimeout(() => setShowTierUpAnimation(false), 1500);
            }
            setPrevTier(currentTier);
          }
        }
      }, [score, prevTier, gameState, isReviewMode]);

      useEffect(() => {
         if(gameState === 'result' && !isReviewMode) {
            const finalTier = getTierMetadata(score).name;
            const currentRecord = { score, tier: finalTier };
            if (score > personalBest.score) {
              setPersonalBest(currentRecord);
              localStorage.setItem('passive_arcade_best_score', JSON.stringify(currentRecord));
            }
         }
      }, [gameState, isReviewMode]);

      const loadDrill = (index, sequence, currentLap) => {
        const activeSeq = sequence || activeSequence;
        const workingLap = currentLap || lap;
        
        if (index >= activeSeq.length) {
          if (isReviewMode) {
            setGameState('review_complete');
            return;
          }
          const nextLap = workingLap + 1;
          setLap(nextLap);
          const newSequence = generateLapSequence(nextLap);
          setActiveSequence(newSequence);
          setDrillIdx(0);
          initDrill(newSequence[0]);
        } else {
          setDrillIdx(index);
          initDrill(activeSeq[index]);
        }
      };

      const initDrill = (drillData) => {
        if (!drillData) return;
        setSelectedParts([]);
        setTypedInput('');
        setFeedback(null);

        if (!drillData.type) { 
          const optionsWithIds = drillData.options.map((opt, i) => ({ id: i, text: opt }));
          setShuffledOptions(optionsWithIds.sort(() => Math.random() - 0.5));
        } else {
          setTimeout(() => {
            if (inputRef.current) inputRef.current.focus();
          }, 50);
        }
      };

      const startGame = () => {
        const newSequence = generateLapSequence(1);
        setActiveSequence(newSequence);
        setScore(0);
        setCombo(0);
        setMaxCombo(0);
        setTimeLeft(200);
        setLap(1);
        setPrevTier('아이언 (Iron)');
        setStats({ correct: 0, total: 0 });
        setWrongDrills([]);
        setIsReviewMode(false);
        setGameState('playing');
        loadDrill(0, newSequence, 1);
      };

      const startReviewMode = () => {
        setIsReviewMode(true);
        setActiveSequence(wrongDrills);
        setDrillIdx(0);
        setTimeLeft(0); // Pause timer conceptually
        setGameState('playing');
        initDrill(wrongDrills[0]);
      };

      const normalizeText = (text) => text.toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' ').trim();

      const handleCorrect = () => {
        if (!isReviewMode) {
          const baseScore = 150;
          const comboMultiplier = 1 + (combo * 0.2); 
          const earned = Math.round(baseScore * comboMultiplier);
          setScore(prev => prev + earned);
          setCombo(prev => {
            const newCombo = prev + 1;
            setMaxCombo(m => Math.max(m, newCombo));
            return newCombo;
          });
          setStats(prev => ({ ...prev, correct: prev.correct + 1, total: prev.total + 1 }));
        }
        setFeedback('correct');
        setTimeout(() => loadDrill(drillIdx + 1), 400);
      };

      const handleMistake = () => {
        if (!isReviewMode) {
          setCombo(0);
          setStats(prev => ({ ...prev, total: prev.total + 1 }));
          setWrongDrills(prev => {
            if (!prev.find(d => d.active === currentDrill.active)) {
              return [...prev, currentDrill];
            }
            return prev;
          });
        }
        setFeedback('wrong');
        const id = setTimeout(() => advanceNext(), 4000); 
        setWrongTimeoutId(id);
      };

      const advanceNext = () => {
        if (wrongTimeoutId) {
          clearTimeout(wrongTimeoutId);
          setWrongTimeoutId(null);
        }
        loadDrill(drillIdx + 1);
      };

      useEffect(() => {
        if (currentDrill && !currentDrill.type && selectedParts.length === 4 && feedback === null) {
          const isMatch = selectedParts.map(p => p.text).join(' ') === currentDrill.expected.join(' ');
          if (isMatch) handleCorrect();
          else handleMistake();
        }
      }, [selectedParts]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && typedInput.trim() && feedback === null) {
          if (normalizeText(typedInput) === normalizeText(currentDrill.expected)) {
            handleCorrect();
          } else {
            handleMistake();
          }
        }
      };

      const selectPart = (part) => {
        if (feedback !== null || selectedParts.length >= 4) return;
        setSelectedParts([...selectedParts, part]);
        setShuffledOptions(shuffledOptions.filter(o => o.id !== part.id));
      };

      const removePart = (part) => {
        if (feedback !== null) return;
        setSelectedParts(selectedParts.filter(p => p.id !== part.id));
        setShuffledOptions([...shuffledOptions, part]);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col items-center p-4 md:p-6 overflow-x-hidden selection:bg-indigo-500/30">
          
          {/* Top Header Controls */}
          <div className="w-full max-w-3xl flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
            <div className="flex items-center gap-2">
              <div className={`p-2 rounded-lg border ${isReviewMode ? 'bg-indigo-600/10 border-indigo-500/30 text-indigo-400' : 'bg-rose-600/10 border-rose-500/30 text-rose-400'}`}>
                {isReviewMode ? <BookOpenCheck className="w-5 h-5" /> : <Swords className="w-5 h-5" />}
              </div>
              <span className="font-black text-lg tracking-widest text-slate-200">
                {isReviewMode ? 'REVIEW' : 'PASSIVE'}<span className={isReviewMode ? 'text-indigo-400' : 'text-red-500'}>{isReviewMode ? 'NOTE' : 'DRILL'}</span>
              </span>
              {!isReviewMode && (
                <span className="bg-red-500/20 border border-red-500/40 text-red-400 text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider animate-pulse flex items-center gap-1 hidden sm:flex">
                  <Shuffle className="w-3 h-3" /> RANDOMIZED
                </span>
              )}
            </div>
            
            {gameState === 'playing' && !isReviewMode && (
              <div className="flex gap-4 items-center">
                {lap > 1 && (
                  <span className="text-xs bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2 py-0.5 rounded font-black font-mono animate-pulse shadow-[0_0_10px_rgba(168,85,247,0.4)] hidden sm:block">
                    LAP {lap} (HIGH DIFF)
                  </span>
                )}
                <div className="text-right">
                  <div className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Score</div>
                  <div className="font-mono font-black text-xl text-white leading-none">{score.toLocaleString()}</div>
                </div>
                <div className={`flex items-center gap-1.5 px-3 py-1 rounded-md border transition-all ${combo > 2 ? 'bg-orange-500/10 border-orange-500/30 text-orange-400 scale-105' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                  <Flame className={`w-4 h-4 ${combo > 2 ? 'animate-bounce text-orange-400' : ''}`} />
                  <span className="font-black font-mono">{combo}x</span>
                </div>
              </div>
            )}

            {gameState === 'playing' && isReviewMode && (
              <div className="flex items-center gap-2">
                 <span className="text-xs text-slate-400 font-bold tracking-widest">진행도:</span>
                 <span className="font-mono text-lg font-black text-indigo-400">{drillIdx + 1} / {activeSequence.length}</span>
              </div>
            )}
          </div>

          <main className="w-full max-w-3xl flex-1 flex flex-col justify-center">
            
            {/* Locked Mode (Password Screen) */}
            {gameState === 'locked' && (
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center animate-fade-in w-full max-w-sm mx-auto my-auto relative overflow-hidden z-20">
                <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 mb-4 shadow-inner relative">
                  <Lock className="w-8 h-8 text-indigo-400" />
                  {pwdError && <div className="absolute inset-0 rounded-full border-2 border-rose-500 animate-ping opacity-50"></div>}
                </div>
                <h2 className="text-2xl md:text-3xl font-black text-white mb-2 tracking-tight">접근 권한 필요</h2>
                <p className="text-slate-400 text-sm mb-6">수업용 아케이드입니다. 선생님이 부여한 4자리 암호를 입력하세요.</p>
                <form onSubmit={handlePasswordSubmit} className="w-full flex flex-col gap-3">
                  <input
                    type="password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className={`w-full bg-slate-950 border ${pwdError ? 'border-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.3)]' : 'border-slate-700 focus:border-indigo-500'} rounded-xl p-4 text-center text-3xl font-mono text-white outline-none transition-all tracking-[0.5em] placeholder:text-slate-700 placeholder:tracking-[0.2em]`}
                    placeholder="••••"
                    maxLength={4}
                    autoFocus
                  />
                  {pwdError && <span className="text-rose-500 text-xs font-bold animate-pulse mt-1">암호가 일치하지 않습니다. 다시 시도하세요.</span>}
                  <button type="submit" className="w-full mt-3 px-6 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-xl transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2">
                    잠금 해제 (UNLOCK) <ChevronRight className="w-5 h-5" />
                  </button>
                </form>
              </div>
            )}

            {/* Welcome Mode */}
            {gameState === 'welcome' && (
              <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center animate-fade-in space-y-6 relative overflow-hidden">
                <div className="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center border border-red-500/20 relative z-10">
                  <Zap className="w-8 h-8 text-red-400 animate-pulse" />
                  <div className="absolute -top-1 -right-2 bg-indigo-500 text-[9px] font-bold px-1.5 py-0.5 rounded text-white rotate-12 shadow">NEW!</div>
                </div>
                <div className="space-y-2 relative z-10">
                  <h1 className="text-3xl md:text-5xl font-black text-white tracking-tight">수동태 <span className="text-red-500">티어 경쟁전</span></h1>
                  <p className="text-slate-400 text-sm md:text-base max-w-lg leading-relaxed mx-auto">
                    영어 수동태 3대 생성 규칙을 실시간 활용하여 제한 시간 **200초** 동안 고득점을 쟁취하세요! <br className="hidden md:block"/>
                    <span className="text-indigo-400 font-semibold text-xs mt-1 inline-block">※ 매판 300개의 문제 풀에서 랜덤하게 출제. 랩2 부터 고난도 무한 모드 진입.</span>
                  </p>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-850 w-full text-left space-y-3 relative z-10">
                  <h3 className="text-sm font-bold text-red-400 flex items-center gap-1.5">
                    <Crown className="w-4 h-4" /> 필수 암기! 수동태 변환 3규칙
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs text-slate-400">
                    <div className="bg-slate-900/40 p-3 rounded-lg border border-slate-800/80">
                      <span className="text-red-400 font-extrabold mr-1">[규칙 1] 목적어 이동</span>
                      <p className="mt-1">원래 능동태의 **목적어**를 새 수동태 문장의 맨 앞 **주어** 자리로 이동시킵니다.</p>
                    </div>
                    <div className="bg-slate-900/40 p-3 rounded-lg border border-slate-800/80">
                      <span className="text-red-400 font-extrabold mr-1">[규칙 2] Be + P.P.</span>
                      <p className="mt-1">동사는 **Be동사 + 과거분사(P.P.)** 형태로 변경합니다. (주어 단복수와 시제에 맞는 be형 선택)</p>
                    </div>
                    <div className="bg-slate-900/40 p-3 rounded-lg border border-slate-800/80">
                      <span className="text-red-400 font-extrabold mr-1">[규칙 3] by + 주어</span>
                      <p className="mt-1">원래 맨 앞에 있던 주어는 앞에 **by**를 삽입해 문장 맨 뒤로 보냅니다.</p>
                    </div>
                  </div>
                </div>

                <div className="w-full text-left space-y-2 relative z-10">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                    <Award className="w-4 h-4 text-amber-500" /> 랭크 매치 등급표 (리뉴얼)
                  </h4>
                  <div className="grid grid-cols-3 sm:grid-cols-5 gap-2 text-xs">
                    {TIERS_CONFIG.map((tier, idx) => (
                      <div key={idx} className={`p-2 rounded-lg border flex flex-col items-center justify-center text-center transition-all ${tier.color} ${tier.shadow}`}>
                        <span className="font-extrabold text-[10px] sm:text-xs leading-tight">{tier.name.split(' ')[0]}</span>
                        <span className="text-[9px] text-slate-400 font-bold mt-1">{tier.min === 0 ? "Default" : `${tier.min.toLocaleString()} pts`}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {personalBest.score > 0 && (
                  <div className="w-full bg-slate-950/40 p-3 rounded-xl border border-slate-850 flex items-center justify-between px-4 text-xs font-semibold relative z-10">
                    <span className="text-slate-400 flex items-center gap-1.5">
                      <TrendingUp className="w-4 h-4 text-indigo-400" /> 개인 최고 기록:
                    </span>
                    <span className="text-indigo-400">
                      {personalBest.tier} / <strong className="text-white font-mono">{personalBest.score.toLocaleString()}</strong> pts
                    </span>
                  </div>
                )}

                <button onClick={startGame} className="group relative w-full md:w-auto px-12 py-4 bg-red-600 hover:bg-red-500 text-white font-black text-lg rounded-xl transition-all active:scale-95 overflow-hidden shadow-lg shadow-red-600/20 z-10">
                  <span className="relative z-10 flex items-center justify-center gap-2">START SPEEDRUN MATCH</span>
                  <div className="absolute inset-0 h-full w-0 bg-white/20 transition-all duration-300 ease-out group-hover:w-full z-0"></div>
                </button>
              </div>
            )}

            {/* Playing Mode */}
            {gameState === 'playing' && currentDrill && (
              <div className="flex flex-col gap-4 relative animate-fade-in">
                
                {!isReviewMode && (
                  <div className="w-full bg-slate-900 rounded-full h-3 border border-slate-800 overflow-hidden relative">
                    <div 
                      className={`h-full transition-all duration-1000 ${timeLeft <= 30 ? 'bg-red-500 shadow-md shadow-red-500/50' : 'bg-rose-500 shadow-md shadow-rose-500/50'}`} 
                      style={{ width: `${(timeLeft / 200) * 100}%` }}
                    ></div>
                  </div>
                )}

                <div className="flex justify-between items-end px-1">
                  <div>
                    <div className={`${isReviewMode ? 'text-indigo-400' : 'text-red-400'} font-black text-sm tracking-widest uppercase mb-0.5`}>
                      Level {currentDrill.level} {!isReviewMode && (lap > 1 ? '(ENDLESS)' : '/ 10')}
                    </div>
                    <div className="text-slate-400 text-xs">
                      {currentDrill.level <= 3 ? "가장 알맞은 단어 블록을 수동태 순서에 맞게 클릭하세요!" : 
                       currentDrill.type === 'verb' ? "알맞은 동사 형태(Be + P.P)를 기입하고 Enter를 누르세요!" : 
                       "완성된 형태의 전체 수동태 문장을 기입하고 Enter를 누르세요!"}
                    </div>
                  </div>
                  
                  {!isReviewMode && (
                    <div className={`flex flex-col items-end ${timeLeft <= 30 ? 'text-rose-400 animate-pulse' : 'text-slate-300'}`}>
                      <div className="text-[9px] font-bold uppercase tracking-wider text-slate-500">Time Remaining</div>
                      <div className="flex items-center gap-1 font-mono text-2xl font-black leading-none mt-1">
                        <Clock className="w-5 h-5" /> {timeLeft}s
                      </div>
                    </div>
                  )}
                </div>

                {!isReviewMode && (
                  <div className="flex items-center justify-between px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl">
                    <div className="flex items-center gap-1.5">
                      <Award className="w-4 h-4 text-yellow-500" />
                      <span className="text-xs font-bold text-slate-400">현재 랭크:</span>
                    </div>
                    <div className={`font-black text-sm px-3 py-0.5 rounded-md border ${getTierMetadata(score).color} ${getTierMetadata(score).shadow}`}>
                      {getTierMetadata(score).name}
                    </div>
                  </div>
                )}

                <div className={`bg-slate-900 border ${feedback === 'correct' ? 'border-emerald-500/50 bg-emerald-950/20' : feedback === 'wrong' ? 'border-rose-500/50 bg-rose-950/20' : 'border-slate-800'} p-5 rounded-xl text-center shadow-lg transition-colors duration-200`}>
                  <div className="text-[10px] text-slate-500 font-bold tracking-widest uppercase mb-2">Active Sentence</div>
                  <div className="text-xl md:text-2xl font-black text-white tracking-wide">
                    {currentDrill.active}
                  </div>
                </div>

                {currentDrill.level <= 3 && !isReviewMode && (
                  <div className="bg-slate-900 border border-slate-850 rounded-xl p-4 text-xs text-red-200 space-y-2">
                    <span className="font-bold block text-red-400">💡 수동태 생성 힌트</span>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-[11px] text-slate-400">
                      <div>1. 능동태의 목적어를 주어로 보냅니다.</div>
                      <div>2. 알맞은 Be동사 + 과거분사를 맞춥니다.</div>
                      <div>3. 원래 주어는 by + 목적격으로 처리합니다.</div>
                    </div>
                  </div>
                )}
                
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl min-h-[180px] flex flex-col justify-center shadow-lg relative overflow-hidden">
                  
                  {!currentDrill.type && (
                    <div className="space-y-5">
                      <div className="flex flex-wrap justify-center gap-2">
                        {[0, 1, 2, 3].map((i) => (
                          <div key={i} 
                               onClick={() => selectedParts[i] && removePart(selectedParts[i])}
                               className={`h-11 flex items-center justify-center px-4 rounded-lg font-bold text-sm md:text-base border border-dashed transition-all cursor-pointer
                                 ${selectedParts[i] ? 'border-indigo-500 bg-indigo-600 text-white border-solid shadow-sm' : 'border-slate-800 bg-slate-950 text-slate-600 w-24 md:w-28'}
                               `}>
                            {selectedParts[i] ? selectedParts[i].text : `Step ${i + 1}`}
                          </div>
                        ))}
                      </div>
                      
                      <div className="flex flex-wrap justify-center gap-2 pt-3 border-t border-slate-850">
                        {shuffledOptions.map((opt) => (
                          <button key={opt.id} onClick={() => selectPart(opt)} disabled={feedback !== null}
                                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded-lg text-slate-200 text-xs md:text-sm font-bold transition-all disabled:opacity-50 shadow-sm">
                            {opt.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {currentDrill.type === 'verb' && (
                    <div className="flex flex-wrap items-center justify-center gap-2 text-base md:text-lg font-medium">
                      <span className="text-slate-300">{currentDrill.prefix}</span>
                      <input 
                        ref={inputRef}
                        type="text" 
                        value={typedInput} 
                        onChange={e => setTypedInput(e.target.value)}
                        onKeyDown={handleKeyDown}
                        disabled={feedback !== null}
                        placeholder="Be + P.P."
                        className={`bg-slate-950 border-b-2 outline-none text-center px-2 py-1 w-40 font-black transition-colors text-sm md:text-base
                          ${feedback === null ? (isReviewMode ? 'border-indigo-500 text-indigo-300' : 'border-red-500 text-red-300') : 
                            feedback === 'correct' ? 'border-emerald-500 text-emerald-400' : 'border-rose-500 text-rose-400'}`}
                      />
                      <span className="text-slate-300">{currentDrill.suffix}</span>
                    </div>
                  )}

                  {currentDrill.type === 'full' && (
                    <div className="w-full">
                      <input 
                        ref={inputRef}
                        type="text" 
                        value={typedInput} 
                        onChange={e => setTypedInput(e.target.value)}
                        onKeyDown={handleKeyDown}
                        disabled={feedback !== null}
                        placeholder="수동태 문장을 전체 입력하세요..."
                        className={`w-full bg-slate-950 border outline-none rounded-lg px-4 py-3 text-sm md:text-base font-mono font-bold transition-all
                          ${feedback === null ? 'border-slate-800 text-slate-200 focus:border-red-500' : 
                            feedback === 'correct' ? 'border-emerald-500 text-emerald-400' : 'border-rose-500 text-rose-400'}`}
                      />
                    </div>
                  )}

                  {feedback === 'wrong' && (
                    <div className="absolute inset-0 bg-slate-950/95 backdrop-blur flex flex-col items-center justify-center p-4 text-center animate-fade-in z-20">
                      <AlertTriangle className="w-12 h-12 text-rose-500 mb-2 animate-bounce" />
                      <h3 className="text-xl md:text-2xl font-black text-white mb-4 tracking-wider">
                        {isReviewMode ? 'AGAIN WRONG!' : 'COMBO BROKEN!'}
                      </h3>

                      <div className="flex flex-col gap-3 w-full max-w-lg mb-4 text-left">
                        <div className="bg-rose-950/40 border border-rose-900/60 rounded-lg p-3 w-full relative overflow-hidden">
                          <div className="absolute left-0 top-0 bottom-0 w-1 bg-rose-500"></div>
                          <div className="text-[10px] text-rose-400/80 font-bold uppercase mb-1">나의 오답 (Your Answer)</div>
                          <div className="text-rose-300 font-mono text-sm md:text-base line-through opacity-80 break-words">
                            {!currentDrill.type 
                              ? (selectedParts.length > 0 ? selectedParts.map(p => p.text).join(' ') : '(빈칸/미완성 제출)')
                              : currentDrill.type === 'verb'
                                ? `${currentDrill.prefix} ${typedInput || '___'} ${currentDrill.suffix}`
                                : typedInput || '(빈칸 제출)'}
                          </div>
                        </div>

                        <div className="bg-emerald-950/20 border border-emerald-900/50 rounded-lg p-3 w-full relative overflow-hidden shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                           <div className="absolute left-0 top-0 bottom-0 w-1 bg-emerald-500"></div>
                           <div className="text-[10px] text-emerald-400/80 font-bold uppercase mb-1">올바른 정답 (Correct Answer)</div>
                           <div className="text-emerald-400 font-mono font-black text-sm md:text-base break-words">
                              {!currentDrill.type ? currentDrill.expected.join(' ') :
                               currentDrill.type === 'verb' ? `${currentDrill.prefix} ${currentDrill.expected} ${currentDrill.suffix}` :
                               currentDrill.expected}
                           </div>
                           <div className="text-[11px] text-emerald-300/80 mt-2 pt-2 border-t border-emerald-900/30 italic">
                             💡 {currentDrill.explanation}
                           </div>
                        </div>
                      </div>
                      
                      <button onClick={advanceNext} className="px-6 py-2.5 bg-white text-slate-900 hover:bg-slate-200 font-black rounded-lg transition-all active:scale-95 flex items-center gap-1.5 text-xs">
                        NEXT DRILL <ChevronRight className="w-4 h-4" />
                      </button>
                      <span className="text-[10px] text-slate-500 mt-2 font-semibold">위 버튼을 누르거나 잠시 후 다음으로 넘어갑니다.</span>
                    </div>
                  )}

                  {feedback === 'correct' && (
                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center z-10 animate-scale-up-fade">
                      <CheckCircle2 className="w-24 h-24 text-emerald-500/40" />
                    </div>
                  )}
                </div>

                {(currentDrill.type === 'verb' || currentDrill.type === 'full') && feedback === null && (
                  <div className="text-center text-[10px] text-slate-500 mt-1 font-mono flex justify-center items-center gap-1">
                    답안 입력 후 <span className="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300 font-bold">Enter ↵</span> 키를 눌러 제출
                  </div>
                )}
              </div>
            )}

            {/* Result Mode */}
            {gameState === 'result' && (
              <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center animate-fade-in relative overflow-hidden space-y-6">
                
                <div className="absolute -top-20 -right-20 w-48 h-48 bg-red-500/10 rounded-full blur-3xl"></div>
                <div className="absolute -bottom-20 -left-20 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl"></div>

                <Trophy className="w-14 h-14 text-yellow-400 mb-2 relative z-10 animate-bounce" />
                <div className="space-y-1 relative z-10">
                  <h1 className="text-2xl md:text-3xl font-black text-white tracking-tight">경쟁전 종료! (TIME'S UP)</h1>
                  <p className="text-slate-400 text-xs md:text-sm">200초 동안 치른 수동태 스피드 매치 결과입니다.</p>
                </div>
                
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 w-full relative z-10">
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex flex-col items-center justify-center">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">득점 점수</span>
                    <span className="text-2xl font-black text-red-500 font-mono">{score.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex flex-col items-center justify-center">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">최대 콤보</span>
                    <span className="text-2xl font-black text-orange-400 font-mono">{maxCombo}</span>
                  </div>
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex flex-col items-center justify-center col-span-2 md:col-span-1">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">최종 정답</span>
                    <span className="text-2xl font-black text-emerald-400 font-mono">{stats.correct} / {stats.total}</span>
                  </div>
                </div>

                <div className="bg-slate-950/80 border border-slate-800 w-full rounded-xl p-5 relative z-10 flex flex-col items-center justify-center space-y-2">
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">FINAL ACHIEVED TIER</span>
                  <div className={`text-4xl font-black px-8 py-3 rounded-xl border ${getTierMetadata(score).color} ${getTierMetadata(score).shadow}`}>
                    {getTierMetadata(score).name}
                  </div>
                  <p className="text-[11px] text-slate-400">
                    {score >= 15000 ? "축하합니다! 무결점 수동태의 지배자 등극." : "다음 티어를 목표로 다시 달려보세요!"}
                  </p>
                </div>

                {score > personalBest.score ? (
                  <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 w-full p-3 rounded-xl text-xs font-bold z-10 relative">
                    🎉 개인 최고 기록 경신 성공! 기기에 새로운 하이 티어가 박제되었습니다.
                  </div>
                ) : (
                  <div className="bg-slate-950/40 border border-slate-850 w-full p-3 rounded-xl text-xs text-slate-400 z-10 relative">
                    개인 최고 점수: <strong className="text-indigo-400">{personalBest.score.toLocaleString()} pts ({personalBest.tier.split(' ')[0]})</strong>
                  </div>
                )}

                <div className="flex flex-col sm:flex-row gap-3 w-full relative z-10 mt-2">
                  {wrongDrills.length > 0 && (
                    <button onClick={startReviewMode} className="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2 border border-indigo-500 shadow-xl">
                      <BookOpenCheck className="w-5 h-5" /> 오답 노트 복습 ({wrongDrills.length}문제)
                    </button>
                  )}
                  <button onClick={startGame} className="flex-1 px-4 py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2 border border-slate-700 shadow-xl">
                    <RotateCcw className="w-5 h-5 text-red-400" /> 새 게임 시작
                  </button>
                </div>
              </div>
            )}

            {/* Review Complete Mode */}
            {gameState === 'review_complete' && (
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center animate-fade-in space-y-6">
                 <CheckCircle2 className="w-16 h-16 text-emerald-500 mb-2" />
                 <div className="space-y-2">
                   <h2 className="text-2xl md:text-3xl font-black text-white">오답 노트 복습 완료!</h2>
                   <p className="text-slate-400 text-sm">틀렸던 {wrongDrills.length}개 문제의 원리를 다시 한번 확인했습니다.<br/>이제 완벽해진 실력으로 새 기록에 도전하세요!</p>
                 </div>
                 <button onClick={startGame} className="mt-4 px-10 py-4 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl transition-all active:scale-95 shadow-xl flex items-center gap-2 text-lg">
                    <Play className="w-5 h-5 fill-current" /> 타이머 매치 재도전
                 </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
